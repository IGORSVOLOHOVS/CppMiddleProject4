# Configure, build and run the test suite the way the dev container does.
#
# The tests here are not self-contained: analyser::file::File shells out to the
# `tree-sitter` CLI to parse the Python fixtures in
# src/metric_impl/tests/files, so the metric tests measure nothing unless a
# tree-sitter binary and a Python grammar are present, at the config path the
# code hard-codes. .devcontainer/Dockerfile builds exactly that, and this job
# reproduces it - including the smoke test below, so that a broken grammar
# fails here with an obvious message instead of as a wall of confusing
# assertion failures inside ctest.
#
# The job ends in `ctest`. A metric tool that compiles and computes the wrong
# cyclomatic complexity is precisely the defect CI exists to find.
#
# scripts/check_before_push.py runs exactly these steps locally.

name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / GCC 15 / Conan / Debug
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # GCC 15 is what .devcontainer/Dockerfile installs; noble has no g++-15
      # in the archive, so the toolchain PPA supplies it. The apt attempt comes
      # first so the PPA drops out once the runner image ships GCC 15.
      - name: Install GCC 15
        run: |
          set -eux
          sudo apt-get update
          if ! sudo apt-get install -y --no-install-recommends g++-15 gcc-15; then
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends g++-15 gcc-15
          fi
          sudo apt-get install -y --no-install-recommends ccache
          g++-15 --version

      # The Dockerfile builds the CLI with `cargo install tree-sitter-cli`;
      # npm ships the same released CLI as a prebuilt binary, which costs
      # seconds instead of minutes and is the same tool.
      #
      # The grammar is compiled from source exactly as the Dockerfile does,
      # with one correction: scanner.c is compiled in too when the grammar has
      # one (Python does - it is what tracks indentation). Leaving it out
      # produces a .so that links but cannot be loaded, because
      # tree_sitter_python_external_scanner_create stays undefined.
      #
      # The checkout of the grammar next to the .so is not redundant: recent
      # tree-sitter CLIs discover grammars by scanning parser-directories for
      # tree-sitter-<lang> directories, older ones load <lang>.so directly, and
      # this satisfies both.
      - name: Install the tree-sitter CLI and the Python grammar
        run: |
          set -eux
          sudo npm install -g tree-sitter-cli
          tree-sitter --version
          sudo mkdir -p /usr/local/lib/tree-sitter
          sudo git clone --depth 1 https://github.com/tree-sitter/tree-sitter-python \
            /usr/local/lib/tree-sitter/tree-sitter-python
          cd /usr/local/lib/tree-sitter/tree-sitter-python
          sources=src/parser.c
          if [ -f src/scanner.c ]; then sources="$sources src/scanner.c"; fi
          sudo gcc -shared -fPIC -Isrc -o /usr/local/lib/tree-sitter/python.so $sources
          # include/file.hpp hard-codes this path, so it has to be this path,
          # and it has to be readable by the user the tests run as.
          sudo mkdir -p /root/.config/tree-sitter
          echo '{"parser-directories":["/usr/local/lib/tree-sitter"]}' \
            | sudo tee /root/.config/tree-sitter/config.json
          sudo chmod 755 /root
          sudo chmod -R a+rX /root/.config

      - name: Check that the parser actually parses
        run: |
          set -eux
          cd "$RUNNER_TEMP"
          printf 'def f(a, b):\n    return a + b\n' > smoke.py
          tree-sitter parse --config-path /root/.config/tree-sitter/config.json smoke.py \
            | tee smoke.out
          grep -q "function_definition" smoke.out

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Conan
        run: pip install "conan>=2,<3"

      - name: Restore the Conan cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-linux-gcc15-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-linux-gcc15-

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-gcc15-${{ github.sha }}
          restore-keys: |
            ccache-linux-gcc15-

      # Same settings as .devcontainer/default, except build_type: the
      # linux-default preset configures Debug, so Conan has to generate the
      # dependency files for Debug or find_package would come up empty.
      - name: Install the dependencies
        env:
          CC: gcc-15
          CXX: g++-15
        run: |
          set -eux
          conan profile detect --force
          conan install . \
            -s build_type=Debug \
            -s compiler=gcc \
            -s compiler.version=15 \
            -s compiler.cppstd=23 \
            -s compiler.libcxx=libstdc++11 \
            --build=missing

      - name: Configure
        env:
          CC: gcc-15
          CXX: g++-15
        run: cmake --preset linux-default -D CMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset linux-default

      - name: Test
        run: ctest --preset linux-default
